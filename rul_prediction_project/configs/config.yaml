experiment:
  name: tcn_transformer_degradation_attention_hi
  seed: 42
  seeds: [42]
  tag: baseline

data:
  dataset_root: "C:\\peng\\RULdata\\ieee-phm-2012-data-challenge-dataset-master\\phm-ieee-2012-data-challenge-dataset-master"
  window_size: 64
  stride: 2
  max_rul: 0
  valid_ratio: 0.33
  sensor_dim: 2
  max_windows_per_bearing: 20000

model:
  backbone_variant: "tcn_transformer"   # tcn_transformer | tcn_only | transformer_only
  tcn_channels: 64
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4, 8]
  transformer_embed_dim: 128
  transformer_heads: 4
  transformer_layers: 2
  transformer_ffn_dim: 256
  dropout: 0.3
  use_hi: true
  use_attention: true
  attention_use_hi_bias: true
  attention_use_temporal_gate: true
  attention_use_recency_bias: true
  attention_temperature: 1.0
  attention_recency_strength: 0.5
  head_hidden_dim: 32
  output_activation: "identity"

train:
  lr: 0.0001
  batch_size: 32
  epochs: 80
  num_workers: 0
  early_stopping_patience: 5
  grad_clip_norm: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 3
  weight_decay: 0.0
  loss_name: "mse"
  use_mae_term: false
  use_bias_regularization: false
  loss_mse_weight: 1.0
  loss_mae_weight: 0.3
  huber_delta: 0.1
  bias_regularization_weight: 0.0

evaluation:
  attention_num_samples: 3
