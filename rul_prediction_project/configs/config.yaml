experiment:
  name: tcn_transformer_degradation_attention_hi
  seed: 42
  seeds: [42]
  tag: baseline

data:
  dataset_root: "C:\\peng\\RULdata\\ieee-phm-2012-data-challenge-dataset-master\\phm-ieee-2012-data-challenge-dataset-master"
  window_size: 64
  stride: 2
  max_rul: 0
  valid_ratio: 0.33
  sensor_dim: 2
  max_windows_per_bearing: 20000

model:
  backbone_variant: "tcn_transformer"   # tcn_transformer | tcn_only | transformer_only
  tcn_channels: 64
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4, 8]
  transformer_embed_dim: 128
  transformer_heads: 4
  transformer_layers: 2
  transformer_ffn_dim: 256
  dropout: 0.3
  use_hi: true
  hi_input_source: "tcn"  # stats | tcn | hybrid
  use_attention: true
  attention_use_hi_bias: true
  attention_use_temporal_gate: true
  attention_use_recency_bias: true
  attention_conditioning_gain: 2.0
  attention_temperature: 1.0
  attention_recency_strength: 0.5
  head_hidden_dim: 32
  output_activation: "identity"

train:
  lr: 0.0001
  batch_size: 32
  epochs: 80
  num_workers: 0
  early_stopping_patience: 8
  early_stopping_min_epochs: 15
  early_stopping_min_delta: 0.0005
  grad_clip_norm: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 5
  weight_decay: 0.0
  loss_name: "mse_mae"
  use_mae_term: true
  use_bias_regularization: false
  loss_mse_weight: 1.0
  loss_mae_weight: 0.2
  huber_delta: 0.1
  bias_regularization_weight: 0.0
  std_regularization_weight: 0.05
  correlation_regularization_weight: 0.05
  hi_supervision_weight: 0.01
  hi_rank_weight: 0.0
  hi_variance_weight: 0.0
  hi_variance_floor: 0.03
  hi_smoothness_weight: 0.01

evaluation:
  attention_num_samples: 3
